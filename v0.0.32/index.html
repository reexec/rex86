<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rex86 browser tests</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d1f23;
    --muted: #5d6470;
    --line: #d9dde3;
    --ok: #1a7f37;
    --fail: #c62828;
    --running: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e6e8eb;
      --muted: #9aa1ab;
      --line: #33373e;
      --ok: #4ac26b;
      --fail: #ff6b6b;
      --running: #d4a72c;
    }
  }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 system-ui, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #agent { color: var(--muted); font-size: 12px; word-break: break-all; margin: 0 0 12px; }
  #status { font-weight: 600; margin: 0 0 12px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .number { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .summary { font: 12px/1.4 ui-monospace, monospace; word-break: break-all; }
  .ok { color: var(--ok); }
  .fail { color: var(--fail); }
  .running { color: var(--running); }
  .state { white-space: nowrap; font-weight: 600; }
  h2 { font-size: 16px; margin: 20px 0 8px; }
  textarea {
    box-sizing: border-box;
    width: 100%;
    height: 160px;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    font: 12px/1.4 ui-monospace, monospace;
  }
  button { margin: 8px 0; padding: 6px 14px; font: inherit; }
  pre { overflow-x: auto; font: 12px/1.4 ui-monospace, monospace; margin: 4px 0 12px; }
  details summary { cursor: pointer; }
  .tool-frame { width: 240px; height: 40px; border: 1px solid var(--line); }
</style>
</head>
<body>
<h1>rex86 browser tests</h1>
<p id="agent"></p>
<p id="status">starting</p>
<div class="table-wrap">
<table id="tests">
  <thead><tr><th>test</th><th>thread</th><th>result</th><th class="number">time</th><th>last line</th></tr></thead>
  <tbody></tbody>
</table>
</div>
<div id="frames"></div>
<h2>Report</h2>
<textarea id="report" readonly></textarea>
<button id="copy" type="button">Copy report</button>
<h2>Output</h2>
<div id="outputs"></div>
<script type="module" src="suite.js"></script>
</body>
</html>
