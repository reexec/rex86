name: ci

# Every branch push checks every host. A PR from a branch of this repository
# already has that push run on its head commit, so its jobs skip the
# pull_request run; PRs from forks run there. A newer push cancels the
# branch's earlier run, except on main, where each commit keeps its result.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows-x86:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build/ci -A Win32 -DREX86_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci --config Debug
      - name: Test
        run: ctest --test-dir build/ci -C Debug --output-on-failure

  linux-x64:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake --preset linux-x64-debug -DREX86_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset linux-x64-debug
      - name: Test
        run: ctest --preset linux-x64-debug

  # AddressSanitizer and UndefinedBehaviorSanitizer over rex86's own
  # targets with GCC's runtimes; third_party stays uninstrumented (design
  # #22, decision 7). The decode cache's warm-up is 0 here, so every test
  # and fuzz runs through the cache (design #34) while the other jobs keep
  # the default.
  linux-x64-sanitize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset linux-x64-debug -DREX86_WARNINGS_AS_ERRORS=ON -DREX86_SANITIZE=address,undefined -DREX86_DECODE_CACHE_WARMUP=0
      - name: Build
        run: cmake --build --preset linux-x64-debug
      - name: Test
        run: ctest --preset linux-x64-debug

  # Every Cpu translating every block at its first entry with the IR
  # evaluator (design #44), under ASan and UBSan with the decode cache always
  # on: the whole ctest, unit tests, trace corpus and robustness smoke
  # included, runs through translation.
  linux-x64-translate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset linux-x64-debug -DREX86_WARNINGS_AS_ERRORS=ON -DREX86_SANITIZE=address,undefined -DREX86_DECODE_CACHE_WARMUP=0 -DREX86_FORCE_TRANSLATION=ON
      - name: Build
        run: cmake --build --preset linux-x64-debug
      - name: Test
        run: ctest --preset linux-x64-debug

  # The robustness harness under libFuzzer (design #31, decision 3): Clang
  # with ASan, UBSan and coverage-guided mutation for a fixed minute. A
  # crashing input is kept as an artifact; rex86_robust_libfuzzer <file>
  # replays it. The whole ctest runs first in this configuration, the only
  # one with Clang's UBSan at -O2, where #32 found UB the other jobs missed
  # (#37).
  linux-x64-libfuzzer:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build/libfuzzer -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DREX86_LIBFUZZER=ON -DREX86_SANITIZE=address,undefined -DREX86_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/libfuzzer
      - name: Test
        run: ctest --test-dir build/libfuzzer --output-on-failure
      - name: Fuzz
        run: |
          mkdir -p build/libfuzzer/corpus build/libfuzzer/crashes
          ./build/libfuzzer/bin/rex86_robust_libfuzzer build/libfuzzer/corpus -max_total_time=60 -timeout=10 -max_len=512 -len_control=0 -artifact_prefix=build/libfuzzer/crashes/
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: libfuzzer-crashes
          path: build/libfuzzer/crashes/

  # A 32-bit x86 host, in the i386 Debian container re2DJ's release uses.
  # JavaScript actions cannot run inside a 32-bit container, so only the
  # build and test go into it. Its ctest includes the integer host fuzz,
  # which needs an i386 process (design #22, decision 1).
  linux-x86:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test in an i386 container
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src i386/debian:bookworm
          setarch i686 bash -c '
          set -euo pipefail;
          apt-get update;
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
          ca-certificates git cmake ninja-build g++ make;
          git config --global --add safe.directory "*";
          grep -m1 "model name" /proc/cpuinfo;
          cmake --preset linux-x86-debug -DREX86_WARNINGS_AS_ERRORS=ON;
          cmake --build --preset linux-x86-debug;
          ctest --preset linux-x86-debug'

  # An AArch64 host. The core must give the same answers here as on x86;
  # the probe's lines are the first such comparison.
  linux-arm64:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset linux-arm64-debug -DREX86_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset linux-arm64-debug
      - name: Test
        run: ctest --preset linux-arm64-debug
      - name: Probe
        run: ./build/linux-arm64-debug/bin/rex86_probe

  # wasm32 through Emscripten, run under Node. The core is portable to a
  # host that cannot execute x86 at all, which is the whole point of it.
  wasm32:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: emcmake cmake -S . -B build/web-wasm-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DREX86_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/web-wasm-release
      - name: Test
        run: ctest --test-dir build/web-wasm-release --output-on-failure
      - name: Probe
        run: node build/web-wasm-release/bin/rex86_probe.js
      # Every Cpu translating every block with the wasm backend through the
      # web adapter (design #45): the whole ctest runs on generated modules.
      - name: Configure (forced wasm translation)
        run: emcmake cmake -S . -B build/web-wasm-translate -G Ninja -DCMAKE_BUILD_TYPE=Release -DREX86_WARNINGS_AS_ERRORS=ON -DREX86_FORCE_TRANSLATION=WASM
      - name: Build (forced wasm translation)
        run: cmake --build build/web-wasm-translate
      - name: Test (forced wasm translation)
        run: ctest --test-dir build/web-wasm-translate --output-on-failure
